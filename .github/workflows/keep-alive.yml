name: Keep Render Alive

on:
  schedule:
    # Ping every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        run: |
          curl -X GET https://YOUR-RENDER-APP.onrender.com/api/health
          echo "Pinged at $(date)"
